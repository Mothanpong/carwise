};
function all(category){return [...(questions[category]||[]),...common];}
function next(category,answers){return all(category).filter(q=>!answers.some(a=>a.id===q.id)).map(q=>{const first=answers[0];let S=q.S;if(category==='start'&&q.id==='lights'&&first?.answer==='มีเสียงแชะ ๆ')S=5;if(category==='noise'&&q.id==='noiselocation'&&first?.answer==='ขณะเลี้ยว / ผ่านพื้นขรุขระ')S=5;return {...q,S,score:S*q.E/(q.R+1)};}).sort((a,b)=>b.score-a.score)[0]||null;}
function rank(category,answers){const scores=[1,1,1],reasons=[[],[],[]];for(const a of answers){const q=all(category).find(q=>q.id===a.id);const i=q?.options.indexOf(a.answer);if(i===undefined||i<0)continue;q.weights[i].forEach((w,j)=>{scores[j]+=w;if(w>0)reasons[j].push(a.answer);});}return groups[category].causes.map((label,i)=>({label,score:scores[i],reasons:reasons[i]})).sort((a,b)=>b.score-a.score);}
function shouldStop(safety,answers){if(safety==='yes')return 'พบสัญญาณที่ผู้ใช้ระบุว่าอาจไม่ปลอดภัย';if(safety==='unknown')return 'ผู้ใช้ไม่มั่นใจเรื่องความปลอดภัย';if(answers.filter(a=>a.answer==='ไม่ทราบ').length>=2)return 'ข้อมูลยังไม่พอ ควรให้ช่างตรวจต่อ';if(answers.length>=4)return 'รวบรวมข้อมูลเบื้องต้นครบแล้ว';return null;}
function validCase(c){return !!(c&&typeof c.id==='string'&&c.id.length<=100&&groups[c.category]&&typeof c.vehicle==='string'&&c.vehicle.length<=200&&typeof c.created==='string'&&!isNaN(Date.parse(c.created))&&typeof c.reason==='string'&&c.reason.length<=1000&&['yes','no','unknown'].includes(c.safety)&&Array.isArray(c.answers)&&c.answers.length<=10&&c.answers.every(a=>typeof a.id==='string'&&typeof a.question==='string'&&a.question.length<=1000&&typeof a.answer==='string'&&a.answer.length<=1000));}
const api={groups,questions,all,next,rank,shouldStop,validCase};root.Carwise=api;if(typeof module!=='undefined')module.exports=api;

function shell(content,active='home',label='ภาพรวม'){const nav=[['home','home','ภาพรวม'],['history','file','ประวัติการคัดกรอง'],['garage','tool','พื้นที่ช่าง'],['method','nodes','ระบบทำงานอย่างไร']];$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><a href="#home" class="brand" aria-label="Carwise หน้าหลัก"><span class="brandmark">c</span><span>carwise<small>.</small></span></a><div class="side-label">YOUR CAR, UNDERSTOOD</div><nav class="nav" aria-label="เมนูหลัก">${nav.map(([id,ic,text])=>`<a href="#${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(ic)}<span>${text}</span>${id==='garage'&&cases.filter(c=>c.status==='queued').length?`<span class="count">${cases.filter(c=>c.status==='queued').length}</span>`:''}</a>`).join('')}</nav><div class="side-bottom"><div class="side-note">${icon('shield')}รู้ข้อมูลก่อน ถึงช่างเข้าใจ<br>ระบบคัดกรองเบื้องต้น<br>การวินิจฉัยเป็นหน้าที่ของช่าง</div><div class="group-label">GROUP 12 · HEURISTIC SEARCH</div></div></aside><main class="main"><header class="topbar"><div class="crumb">Carwise <span>/</span> <strong>${label}</strong></div><div class="top-right"><span class="local"><span class="dot"></span>${storageOK?'ข้อมูลเก็บในเครื่องนี้':'ข้อมูลยังไม่บันทึกถาวร'}</span><span class="pill neutral">เว็บต้นแบบ</span><span class="avatar" aria-label="กลุ่ม 12">12</span></div></header><div class="fade">${content}</div><footer class="footer"><span>CARWISE © 2026 · ACTIVE LEARNING / GROUP 12</span><span>ผู้ใช้รถ → Heuristic Search → อู่ / ช่าง</span></footer></main></div>`;bind();}

function home(){shell(`${intro('A LITTLE CLARITY GOES A LONG WAY','เข้าใจอาการรถ ก่อนถึงมือช่าง','เริ่มจากสิ่งที่คุณสังเกตได้ เราช่วยเรียบเรียงข้อมูลให้ชัดเจน',`<button class="btn ghost" data-action="demo">ดูเคสตัวอย่าง ${icon('arrow')}</button>`)}<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> SMART QUESTIONS. CLEARER ANSWERS.</div><h2>รถมีอาการแปลกไป?<br><em>เริ่มหาคำตอบไปด้วยกัน</em></h2><p>ตอบคำถามง่าย ๆ จากอาการที่พบ<br>รับสรุปข้อมูลที่พร้อมส่งต่อให้ช่าง</p><button class="btn primary" data-action="start" data-category="start">เริ่มคัดกรองอาการ ${icon('arrow')}</button></div><div class="hero-art"><div class="art-grid"></div><div class="hero-orbit"></div><span class="art-label">BUILT AROUND YOUR CAR</span>${carArt}<div class="art-foot"><span>01 / OBSERVE</span><span>02 / UNDERSTAND</span><span>03 / CONNECT</span></div></div></section><div class="workflow"><div class="flow-step"><span class="flow-num">01</span><div><h3>คุณเล่าอาการ</h3><p>ไม่จำเป็นต้องมีความรู้ด้านช่าง</p></div><span class="flow-arrow">→</span></div><div class="flow-step"><span class="flow-num">02</span><div><h3>ระบบช่วยคัดกรอง</h3><p>ถามต่อจากข้อมูลที่คุณบอก</p></div><span class="flow-arrow">→</span></div><div class="flow-step"><span class="flow-num">03</span><div><h3>ส่งต่อให้ช่างเข้าใจ</h3><p>สรุปอาการเพื่อประกอบการตรวจ</p></div></div></div>${draft?`<div class="alert soft">${icon('clock')}<div>คุณมีการคัดกรองที่ยังไม่เสร็จ <button class="text-link" data-action="resume">ทำต่อจากเดิม →</button></div></div>`:''}<div class="section-title"><h2>วันนี้รถของคุณมีอาการแบบไหน?</h2><span>เลือกอาการหลัก 1 ข้อ</span></div><div class="dashboard-grid"><div class="symptom-grid">${Object.entries(C.groups).map(([id,g])=>`<button class="symptom" data-action="start" data-category="${id}">${icon(g.icon)}<span class="arrow">↗</span><h3>${g.label}</h3><p>${g.desc}</p></button>`).join('')}</div><aside class="note-card"><div><div class="badge-icon">${icon('shield')}</div><h3>ความปลอดภัย<br>มาก่อนคำตอบ</h3><p>ไม่แน่ใจ ตอบ “ไม่ทราบ” ได้เสมอ<br>ระบบจะหยุดเมื่อข้อมูลไม่พอ<br>และส่งต่อให้ช่างตรวจจริง</p></div><a href="#method" class="text-link">รู้จักขอบเขตของระบบ ↗</a></aside></div><section class="recent"><div class="section-title"><h2>การคัดกรองล่าสุด</h2><a class="text-link" href="#history">ดูประวัติทั้งหมด →</a></div>${caseRows(cases.slice(0,3))}</section>`);}
function start(category){if(draft){go('intake');toast('เปิดแบบร่างเดิมให้แล้ว หากต้องการเริ่มใหม่ ใช้ปุ่มล้างแบบร่าง');return;}draft={category,vehicle:'',year:'',context:'',answers:[],safety:null,stage:'intake'};persist();go('intake');}
function intake(){if(!draft){go('home');return;}shell(`${intro('LET’S START WITH YOUR CAR','บอกเราเกี่ยวกับรถของคุณ','ข้อมูลเท่าที่ทราบก็พอ ไม่ต้องระบุชื่อหรือข้อมูลส่วนตัว')}<div class="layout"><section class="panel"><div class="progress"><i class="on"></i><i></i><i></i></div><h2>ข้อมูลรถและอาการ</h2><p>เราจะใช้ข้อมูลนี้ประกอบสรุปส่งต่อให้ช่าง</p><form id="intake-form"><div class="form-grid"><label class="field"><span>ยี่ห้อ / รุ่นรถ <span class="required">*</span></span><input name="vehicle" maxlength="100" required placeholder="เช่น Toyota Yaris หรือ Honda Click" value="${esc(draft.vehicle)}"></label><label class="field">ปีรถ (ถ้าทราบ)<input name="year" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="เช่น 2020" value="${esc(draft.year)}"><small>ใช้ปี ค.ศ. หรือเว้นว่าง</small></label><label class="field full">อาการหลัก<select name="category">${Object.entries(C.groups).map(([id,g])=>`<option value="${id}" ${draft.category===id?'selected':''}>${g.label}</option>`).join('')}</select></label><label class="field full">เล่าเหตุการณ์ที่เกิดขึ้น<textarea name="context" maxlength="2000" placeholder="เกิดเมื่อไหร่ กำลังทำอะไร และมีสิ่งใดต่างจากปกติ">${esc(draft.context)}</textarea><small>ไม่ต้องลองทำให้เกิดอาการซ้ำเพื่อกรอกข้อมูล</small></label></div><div class="actions"><a href="#home" class="btn ghost">กลับหน้าหลัก</a><button class="btn dark" type="submit">ถัดไป: ความปลอดภัย ${icon('arrow')}</button></div></form></section><aside class="aside-card"><div class="tiny-label">BEFORE WE BEGIN</div><h3>คุณรู้จักอาการ เราช่วยเรียบเรียง</h3><p>ใช้เวลาประมาณ 2–3 นาที<br>ตอบได้จากสิ่งที่เคยสังเกต ไม่ต้องใช้เครื่องมือหรือทดลองซ่อมรถ</p><div class="divider"></div><ul><li>ตอบ “ไม่ทราบ” ได้</li><li>หยุดและส่งต่อได้ทุกขั้นตอน</li><li>ไม่มีการยืนยันชิ้นส่วนเสีย</li></ul><div class="divider"></div><button class="text-link" data-action="reset-draft">ล้างแบบร่างและเริ่มใหม่</button>${draft.answers.length?'<button class="btn small" data-action="resume">กลับไปคำถามที่ค้างไว้</button>':''}</aside></div>`,'home','เริ่มคัดกรอง');$('#intake-form').addEventListener('input',()=>{const f=new FormData($('#intake-form'));draft.vehicle=f.get('vehicle');draft.year=f.get('year');draft.context=f.get('context');persist()});$('#intake-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(!String(f.get('vehicle')).trim()){toast('กรุณาระบุยี่ห้อหรือรุ่นรถ');return;}if(draft.category!==f.get('category'))draft.answers=[];Object.assign(draft,{vehicle:String(f.get('vehicle')).trim(),year:f.get('year'),context:f.get('context'),category:f.get('category'),stage:'safety'});persist();go('safety')});}
function safety(){if(!draft?.vehicle){go('intake');return;}shell(`${intro('SAFETY FIRST','ก่อนเริ่ม ขอเช็กความปลอดภัย','ตอบจากสถานการณ์ที่พบ ไม่ต้องตรวจหรือทดลองเพิ่มเติม')}<div class="layout"><section class="panel"><div class="progress"><i class="on"></i><i class="on"></i><i></i></div><div class="question-label">SAFETY CHECK / ไม่ใช้คะแนน HEURISTIC</div><h2 class="question-title">มีสิ่งที่ทำให้คุณรู้สึกว่า<br>สถานการณ์อาจไม่ปลอดภัยหรือไม่?</h2><p>เช่น มีควัน กลิ่นไหม้รุนแรง ควบคุมรถผิดปกติ หรือมีเหตุที่ไม่มั่นใจ</p><div class="options"><button class="option" data-action="safety" data-answer="yes"><span>มีสัญญาณที่น่ากังวล</span><span class="circle"></span></button><button class="option" data-action="safety" data-answer="no"><span>ไม่พบจากสิ่งที่สังเกตได้</span><span class="circle"></span></button><button class="option unknown" data-action="safety" data-answer="unknown"><span>ไม่แน่ใจ / ประเมินไม่ได้</span><span class="circle"></span></button></div><a href="#intake" class="text-link">← กลับไปแก้ข้อมูลรถ</a></section><aside class="aside-card">${icon('shield')}<h3 style="margin-top:18px">ไม่แน่ใจ หยุดไว้ก่อนได้</h3><p>ถ้าพบความเสี่ยงหรือประเมินไม่ได้ ระบบจะไม่ถามต่อ และสร้างสรุปเพื่อให้คุณขอความช่วยเหลือจากช่าง</p><p>การตอบว่าไม่พบสัญญาณ ไม่ใช่การรับรองว่ารถปลอดภัยหรือขับต่อได้</p></aside></div>`,'home','ตรวจความปลอดภัย');}
function questioning(){if(!draft?.vehicle){go('intake');return;}if(draft.safety!=='no'){go('safety');return;}const reason=C.shouldStop(draft.safety,draft.answers);if(reason){finish(reason);return;}const q=C.next(draft.category,draft.answers);if(!q){finish('ไม่มีคำถามที่เหมาะสมเพิ่มเติม');return;}shell(`${intro('ONE QUESTION AT A TIME','ค่อย ๆ ทำความเข้าใจอาการ','เลือกคำตอบจากสิ่งที่จำได้ ไม่ต้องทดลองกับรถ')}<div class="layout"><section class="panel"><div class="progress">${Array.from({length:4},(_,i)=>`<i class="${i<=draft.answers.length?'on':''}"></i>`).join('')}</div><div class="question-label">QUESTION ${String(draft.answers.length+1).padStart(2,'0')} / สูงสุด 4 คำถาม</div><h2 class="question-title">${q.text}</h2><p>${q.hint}</p><div class="options">${[...q.options,'ไม่ทราบ'].map(a=>`<button class="option ${a==='ไม่ทราบ'?'unknown':''}" data-action="answer" data-answer="${esc(a)}"><span>${a}</span><span class="circle"></span></button>`).join('')}</div><div class="actions">${draft.answers.length?`<button class="btn ghost" data-action="undo">${icon('back')} แก้คำตอบก่อนหน้า</button>`:''}<button class="btn danger" data-action="stop">หยุดคัดกรองและส่งต่อ</button></div></section><aside class="aside-card"><div class="tiny-label">HEURISTIC IN ACTION</div><h3>ทำไมถึงถามข้อนี้?</h3><p>ระบบเลือกคำถามที่เหมาะกับข้อมูลปัจจุบันและตอบได้ง่ายก่อน</p><div class="math">h(n) = S × E / (R + 1)</div><div class="metric"><span>ความเกี่ยวข้องกับข้อมูล · S</span><strong>${q.S}</strong></div><div class="metric"><span>ความง่ายในการตอบ · E</span><strong>${q.E}</strong></div><div class="metric"><span>ความเสี่ยงของคำถาม · R</span><strong>${q.R}</strong></div><div class="metric"><span>คะแนนจัดลำดับคำถาม</span><strong>${q.score}</strong></div><p>คะแนนตัวอย่างเพื่อสาธิตอัลกอริทึม ไม่ใช่เปอร์เซ็นต์ความแม่นยำ</p><a class="text-link" href="#method">ดูหลักการทำงาน ↗</a></aside></div>`,'home','คัดกรองอาการ');}
function finish(reason){const c={id:'CW-'+Date.now().toString(36).toUpperCase(),vehicle:draft.vehicle,year:draft.year,context:draft.context,category:draft.category,answers:[...draft.answers],safety:draft.safety||'unknown',created:new Date().toISOString(),reason,status:'draft',mechanic:{}};cases.unshift(c);draft=null;persist();go('case/'+c.id);}
function summary(c,review=false){const ranked=C.rank(c.category,c.answers),unsafe=c.safety!=='no';return `<div class="summary-head"><div><div class="case-id">${esc(c.id)} ${c.demo?' / DEMO CASE':''}</div><h2 style="margin-top:10px">${esc(c.vehicle)} ${esc(c.year||'')}</h2><p>${esc(C.groups[c.category].label)} · ${date(c.created)}</p></div>${pill(c)}</div><div class="alert ${unsafe?'':'soft'}">${icon(unsafe?'alert':'shield')}<div><strong>${unsafe?'หยุดการคัดกรอง · ขอความช่วยเหลือจากช่าง':'ข้อมูลคัดกรองเบื้องต้น พร้อมให้ช่างตรวจต่อ'}</strong>${esc(c.reason)}<br>ข้อมูลนี้ไม่ใช่ผลวินิจฉัย และไม่ยืนยันว่าขับต่อได้</div></div><section class="summary-section"><h3>01 / ข้อมูลจากผู้ใช้</h3><dl class="keyvals"><dt>อาการหลัก</dt><dd>${esc(C.groups[c.category].label)}</dd><dt>เหตุการณ์</dt><dd>${esc(c.context||'ไม่ได้ระบุ')}</dd><dt>ความปลอดภัย</dt><dd>${c.safety==='yes'?'ผู้ใช้รายงานสัญญาณที่น่ากังวล':c.safety==='unknown'?'ผู้ใช้ไม่มั่นใจ / ประเมินไม่ได้':'ผู้ใช้ไม่พบสัญญาณน่ากังวลจากที่สังเกต (ยังไม่ได้ตรวจยืนยัน)'}</dd></dl><div class="evidence">${c.answers.map(a=>`<div class="evidence-item">${esc(a.question)}<br><strong>${esc(a.answer)}</strong><small>ผู้ใช้รายงาน${a.score!==undefined?' · คะแนนคำถามขณะเลือก '+esc(a.score):''}</small></div>`).join('')||'<p>หยุดก่อนเริ่มคำถามเพิ่มเติม</p>'}</div></section><section class="summary-section"><h3>02 / ข้อสงสัยของระบบ</h3><p>ใช้เป็นจุดเริ่มต้นสำหรับการตรวจ ไม่ยืนยันว่าระบบหรือชิ้นส่วนใดเสีย</p>${unsafe||!c.answers.some(a=>a.answer!=='ไม่ทราบ')?'<div class="alert">งดจัดลำดับสาเหตุ เนื่องจากต้องหยุดคัดกรองหรือไม่มีข้อมูลเพียงพอ</div>':ranked.map((r,i)=>`<div class="rank"><span class="rank-num">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(r.label)}</h3><p>${r.reasons.length?'ข้อมูลประกอบ: '+esc([...new Set(r.reasons)].join(' · ')):'ยังไม่มีข้อมูลเฉพาะสนับสนุน ต้องตรวจเพิ่มเติม'}</p></div></div>`).join('')}<p>ลำดับมาจากกฎตัวอย่างในโปรเจกต์ ไม่ใช่ผลประเมินทางช่างที่ผ่านการรับรอง</p></section><section class="summary-section"><h3>03 / สิ่งที่ยังไม่ทราบ</h3><p>${c.answers.filter(a=>a.answer==='ไม่ทราบ').map(a=>esc(a.question)).join('<br>')||'ไม่มีคำตอบ “ไม่ทราบ” ในคำถามที่ตอบ'}</p><p>ส่วนคัดกรองนี้ไม่มีผลตรวจรถจริงหรือค่าตรวจวัด ผลที่ช่างบันทึกจะแสดงแยกต่างหาก${c.answers.length<4?' · คำถามที่ยังไม่ได้ถามไม่ถูกตีความว่าไม่มีอาการ':''}</p></section>${!review&&c.mechanic?.diagnosis?`<section class="summary-section"><h3>04 / บันทึกของช่าง</h3><dl class="keyvals"><dt>ผู้บันทึก</dt><dd>${esc(c.mechanic.name)}</dd><dt>สิ่งที่ตรวจ</dt><dd>${esc(c.mechanic.inspected)}</dd><dt>ผลตรวจ</dt><dd>${esc(c.mechanic.diagnosis)}</dd><dt>แผนดำเนินการ</dt><dd>${esc(c.mechanic.plan)}</dd></dl><p>บันทึกโดยผู้ใช้พื้นที่ช่างในเว็บต้นแบบนี้ ยังไม่มีการยืนยันตัวตนผู้บันทึก</p></section>`:''}`;}
function casePage(id){const c=cases.find(c=>c.id===id);if(!c){notFound();return;}shell(`<a class="back" href="#history">${icon('back')} ประวัติการคัดกรอง</a>${intro('DIAGNOSTIC SUMMARY','เรื่องราวอาการรถ ในที่เดียว','แยกข้อมูลที่พบ ข้อสงสัย และสิ่งที่ยังต้องตรวจให้ชัดเจน',`<button class="btn ghost" data-action="print">${icon('print')} พิมพ์สรุป</button>`)}<div class="layout"><article class="panel">${summary(c)}</article><aside class="aside-card"><div class="tiny-label">THE NEXT STEP</div><h3>ส่งต่อข้อมูลให้ช่าง</h3><p>เคสในเว็บนี้เก็บอยู่บนเบราว์เซอร์ของคุณ ส่งเข้าพื้นที่ช่างเพื่อทดลอง หรือดาวน์โหลดไฟล์เพื่อนำไปเปิดบนอีกเครื่อง</p><div class="stack">${c.status==='draft'?`<button class="btn dark" data-action="handoff" data-id="${esc(c.id)}">ส่งเข้าพื้นที่ช่าง ${icon('arrow')}</button>`:`<a class="btn dark" href="#review/${encodeURIComponent(c.id)}">เปิดในพื้นที่ช่าง ${icon('arrow')}</a>`}<button class="btn" data-action="txt" data-id="${esc(c.id)}">${icon('download')} ดาวน์โหลดสรุป .txt</button><button class="btn" data-action="json" data-id="${esc(c.id)}">${icon('download')} ส่งออกไฟล์เคส .json</button></div><div class="divider"></div><p>ไฟล์เคสเปิดผ่านปุ่ม “นำเข้าเคส” ในพื้นที่ช่างได้ ไม่มีการส่งข้อมูลไปอู่ภายนอกโดยอัตโนมัติ</p><a class="text-link" href="#home">กลับไปหน้าหลัก →</a></aside></div>`,'history','สรุปอาการ');}
function listing(garage){const list=cases.filter(c=>!garage||c.status!=='draft');shell(`${intro(garage?'WORKSHOP SPACE':'YOUR CAR JOURNAL',garage?'ข้อมูลพร้อม ช่างเริ่มได้ชัดเจน':'ประวัติการคัดกรอง',garage?'รับข้อมูลอาการ ตรวจรถจริง และบันทึกผลในมุมมองของช่าง':'ทุกอาการ ทุกคำตอบ และข้อมูลที่ส่งต่อ เก็บไว้ที่นี่',garage?`<button class="btn dark" data-action="import">${icon('upload')} นำเข้าเคส</button>`:`<a class="btn dark" href="#home">${icon('plus')} คัดกรองใหม่</a>`)}${garage?`<div class="stats"><div class="stat"><span>รอช่างรับเคส</span><strong>${list.filter(c=>c.status==='queued').length}</strong></div><div class="stat"><span>กำลังตรวจ</span><strong>${list.filter(c=>c.status==='reviewing').length}</strong></div><div class="stat"><span>บันทึกผลแล้ว</span><strong>${list.filter(c=>c.status==='completed').length}</strong></div></div><div class="alert soft">${icon('tool')}<div>พื้นที่สาธิตบทบาทช่างบนเครื่องเดียวกัน · ช่างต้องตรวจรถจริงก่อนสรุปผล<br>ยังไม่มีบัญชีผู้ใช้หรือระบบตรวจสอบตัวตนช่าง</div></div>`:''}<div class="toolbar"><label class="sr-only" for="case-search">ค้นหารถหรือรหัสเคส</label><input id="case-search" class="search" placeholder="ค้นหารถหรือรหัสเคส…" value="${esc(query)}"><div class="filter">${[['all','ทั้งหมด'],['queued','รอรับเคส'],['reviewing','กำลังตรวจ'],['completed','บันทึกผลแล้ว']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-action="filter" data-filter="${v}">${l}</button>`).join('')}</div></div><div id="case-table"></div><input type="file" id="import-file" accept=".json,application/json" hidden>` ,garage?'garage':'history',garage?'พื้นที่ช่าง':'ประวัติ');const update=()=>{$('#case-table').innerHTML=caseRows(list.filter(c=>(filter==='all'||c.status===filter)&&(c.vehicle+' '+c.id).toLowerCase().includes(query.toLowerCase())),garage);bind($('#case-table'))};update();$('#case-search').addEventListener('input',e=>{query=e.target.value;update()});$('#import-file').addEventListener('change',importCase);}
function review(id){const c=cases.find(c=>c.id===id);if(!c){notFound();return;}if(c.status==='draft'){go('case/'+id);return;}const m=c.mechanic||{};shell(`<a class="back" href="#garage">${icon('back')} กลับพื้นที่ช่าง</a>${intro('WORKSHOP / CASE DETAIL','ตรวจจากข้อมูล ยืนยันจากรถจริง','ข้อสงสัยของระบบเป็นเพียงข้อมูลประกอบ การวินิจฉัยเป็นหน้าที่ช่าง')}<div class="layout"><article class="panel">${summary(c,true)}</article><aside class="panel"><div class="tiny-label">MECHANIC’S NOTES</div><h2>บันทึกการตรวจ</h2><p>กรอกผลจากการตรวจจริง ไม่คัดลอกข้อสงสัยของระบบเป็นข้อสรุป</p>${c.status==='queued'?`<button class="btn dark" style="width:100%;margin-bottom:20px" data-action="accept" data-id="${esc(id)}">รับเคสนี้ ${icon('check')}</button>`:''}<form id="mechanic-form"><div class="stack"><label class="field">ชื่อผู้บันทึก<input name="name" maxlength="100" required value="${esc(m.name||'')}" placeholder="ชื่อช่าง / ผู้ทดสอบ"></label><label class="field">สิ่งที่ตรวจและหลักฐาน<textarea name="inspected" maxlength="3000" required placeholder="ระบุสิ่งที่ตรวจจริงและผลที่ได้">${esc(m.inspected||'')}</textarea></label><label class="field">ผลตรวจ / ข้อวินิจฉัย<textarea name="diagnosis" maxlength="3000" required placeholder="ระบุผลตรวจ หรือสิ่งที่ยังยืนยันไม่ได้">${esc(m.diagnosis||'')}</textarea></label><label class="field">แผนดำเนินการต่อ<textarea name="plan" maxlength="3000" required placeholder="ขั้นตอนถัดไปที่แจ้งผู้ใช้">${esc(m.plan||'')}</textarea></label><label class="field">สถานะ<select name="status"><option value="reviewing" ${c.status==='reviewing'?'selected':''}>กำลังตรวจ</option><option value="completed" ${c.status==='completed'?'selected':''}>บันทึกผลตรวจแล้ว</option></select></label><button type="submit" class="btn dark">บันทึกผลตรวจ ${icon('check')}</button><button type="button" class="btn" data-action="json" data-id="${esc(id)}">${icon('download')} ส่งออกเคสที่อัปเดต</button></div></form><p>ข้อมูลในมุมมองผู้ใช้จะอัปเดตหลังบันทึก</p></aside></div>`,'garage','รายละเอียดเคส');$('#mechanic-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(['name','inspected','diagnosis','plan'].some(k=>!String(f.get(k)).trim())){toast('กรุณากรอกข้อมูลผลตรวจให้ครบ');return;}c.mechanic={name:f.get('name'),inspected:f.get('inspected'),diagnosis:f.get('diagnosis'),plan:f.get('plan'),updated:new Date().toISOString()};c.status=f.get('status');persist();render();toast('บันทึกผลตรวจแล้ว ผู้ใช้เปิดดูได้ในหน้าสรุปเคส')});}
function method(){shell(`${intro('TRANSPARENT BY DESIGN','ทุกคำถาม มีเหตุผลที่เลือก','ดูวิธีทำงานของ Heuristic Search และขอบเขตของเว็บต้นแบบ')}<div class="method-grid"><section class="panel"><div class="eyebrow">01 / SEARCH PROCESS</div><h2>จากอาการ สู่ข้อมูลส่งต่อ</h2><ol class="numbered"><li>รับข้อมูลรถ อาการหลัก และบริบท</li><li>ตรวจ Safety gate หากเสี่ยงหรือไม่แน่ใจ ให้หยุดทันที</li><li>จัดอันดับคำถามที่ยังไม่ได้ตอบด้วย h(n)</li><li>รับคำตอบ บันทึกหลักฐาน และปรับคะแนนคำถามถัดไป</li><li>หยุดเมื่อครบ 4 คำถาม ตอบไม่ทราบ 2 ข้อ หรือผู้ใช้ขอหยุด</li><li>สรุปข้อมูลและส่งให้ช่างตรวจจริง</li></ol></section><section class="panel"><div class="eyebrow">02 / HEURISTIC FUNCTION</div><h2>เลือกคำถามที่เหมาะก่อน</h2><div class="math">h(n) = S × E / (R + 1)</div><p><strong>S · ความเกี่ยวข้อง</strong><br>คะแนนตัวอย่าง 1–5 ปรับตามอาการและคำตอบก่อนหน้า</p><p><strong>E · ความง่ายในการตอบ</strong><br>คะแนน 1–5 เลือกคำถามที่ตอบจากความจำได้</p><p><strong>R · ความเสี่ยงของขั้นตอน</strong><br>คำถามในต้นแบบนี้ไม่ให้ทดลองกับรถ จึงกำหนดเป็น 0 และใช้ Safety gate แยกต่างหาก</p></section><section class="panel"><div class="eyebrow">03 / HONEST LIMITS</div><h2>คะแนนไม่ใช่ผลวินิจฉัย</h2><p>เว็บใช้กฎและคะแนนตัวอย่างแบบกำหนดไว้ ไม่ได้เรียก AI หรือใช้ฐานข้อมูลรถจริง คะแนนแสดงความสำคัญในการเลือกคำถาม ไม่ใช่โอกาสที่ชิ้นส่วนเสีย</p><p>ใช้การเลือกคำถามแบบ greedy: เลือกคะแนนสูงสุดในแต่ละรอบ ไม่รับประกันคำตอบที่เหมาะที่สุด และไม่ได้อ้างว่าเป็น A*</p><p>“ไม่ทราบ” จะเก็บเป็นข้อมูลที่ขาด ไม่ตีความว่าไม่มีอาการ กลุ่มสาเหตุยังคงอยู่เพื่อให้ช่างตรวจต่อ</p><a class="text-link" href="https://inst.eecs.berkeley.edu/~cs188/textbook/search/informed.html" target="_blank" rel="noopener">อ้างอิงหลักการ Informed Search · UC Berkeley ↗</a></section><section class="panel"><div class="eyebrow">04 / YOUR DATA</div><h2>ข้อมูลอยู่กับคุณ</h2><p>เคสและแบบร่างเก็บใน localStorage ของเบราว์เซอร์นี้ ไม่มีเซิร์ฟเวอร์รับข้อมูล ไม่มีระบบล็อกอิน และไม่ส่งเคสไปอู่จริง</p><p>ล้างข้อมูลเบราว์เซอร์แล้วข้อมูลจะหาย ส่งออกไฟล์ .json เพื่อสำรองหรือย้ายไปอีกเครื่อง และใช้ .txt เพื่ออ่านหรือส่งต่อให้ช่าง</p><p>ก่อนใช้งานกับลูกค้าจริง ต้องมีฐานความรู้ที่ช่างตรวจรับรอง การทดสอบความปลอดภัย ระบบบัญชี และการจัดเก็บข้อมูลที่เหมาะสม</p></section></div>${draft?'<div class="actions"><button class="btn dark" data-action="resume">กลับไปคัดกรองต่อ →</button></div>':''}`,'method','วิธีทำงาน');}
function notFound(){shell(`${intro('CASE NOT FOUND','ไม่พบเคสนี้ในเครื่อง','ลองเปิดประวัติ หรือนำเข้าไฟล์เคสที่ได้รับ')}<a class="btn dark" href="#history">ดูประวัติการคัดกรอง</a>`,'history','ไม่พบเคส');}
function demo(){let c=cases.find(c=>c.demo);if(!c){const qs=C.all('start');c={id:'CW-DEMO-001',vehicle:'Toyota Yaris',year:'2020',category:'start',context:'เคสตัวอย่างสำหรับทดลอง: หลังจอดรถไว้หลายวัน พบว่าสตาร์ทไม่ติด',created:new Date().toISOString(),safety:'no',reason:'รวบรวมข้อมูลเบื้องต้นครบแล้ว',status:'queued',demo:true,mechanic:{},answers:[{id:'startsound',question:qs[0].text,answer:'มีเสียงแชะ ๆ',score:25},{id:'lights',question:qs[1].text,answer:'หรี่ลงหรือดับ',score:25},{id:'recent',question:qs[2].text,answer:'จอดไว้นาน / เคยเปิดอุปกรณ์ทิ้งไว้',score:15},{id:'repeat',question:qs[3].text,answer:'ครั้งแรก',score:10}]};cases.unshift(c);persist();}go('case/'+c.id);}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('สร้างไฟล์ดาวน์โหลดแล้ว');}
function asText(c){return `CARWISE — Diagnostic Summary\nข้อมูลคัดกรอง ไม่ใช่ผลวินิจฉัย\n\nเคส: ${c.id}${c.demo?' (ตัวอย่าง)':''}\nรถ: ${c.vehicle} ${c.year||''}\nวันที่: ${date(c.created)}\nอาการ: ${C.groups[c.category].label}\nเหตุการณ์: ${c.context||'ไม่ระบุ'}\nความปลอดภัย: ${c.safety==='no'?'ผู้ใช้ไม่พบสัญญาณน่ากังวล แต่ยังไม่ได้ตรวจยืนยัน':c.safety==='yes'?'ผู้ใช้รายงานสัญญาณน่ากังวล':'ผู้ใช้ไม่แน่ใจ'}\n\nคำตอบของผู้ใช้\n${c.answers.map(a=>a.question+'\n→ '+a.answer).join('\n\n')}\n\nเหตุผลที่หยุด: ${c.reason}\n\nข้อสงสัยของระบบ (กฎตัวอย่าง ไม่ยืนยันชิ้นส่วนเสีย)\n${c.safety==='no'&&c.answers.some(a=>a.answer!=='ไม่ทราบ')?C.rank(c.category,c.answers).map((r,i)=>`${i+1}. ${r.label} — ${r.reasons.join(', ')||'ยังไม่มีข้อมูลสนับสนุนเฉพาะ'}`).join('\n'):'งดจัดลำดับสาเหตุ'}\n\nสิ่งที่ยังไม่ทราบ\n${c.answers.filter(a=>a.answer==='ไม่ทราบ').map(a=>a.question).join('\n')}\nยังไม่มีผลตรวจจริง/ค่าตรวจวัดจากช่างในส่วนคัดกรอง\n\nบันทึกของช่าง\n${c.mechanic?.diagnosis?`ผู้บันทึก: ${c.mechanic.name}\nสิ่งที่ตรวจ: ${c.mechanic.inspected}\nผลตรวจ: ${c.mechanic.diagnosis}\nแผน: ${c.mechanic.plan}`:'ยังไม่มีบันทึก'}\n\nสถานะ: ${stateName[c.status]}\nต้นแบบนี้ไม่มีการยืนยันตัวตนช่าง ไม่รับรองว่ารถปลอดภัยหรือขับต่อได้\n`;}
async function importCase(e){const file=e.target.files[0];if(!file)return;if(file.size>200000){toast('ไฟล์ใหญ่เกินกำหนด 200 KB');return;}try{const data=JSON.parse(await file.text());if(data.format!=='carwise-case-v1'||!C.validCase(data.case))throw Error();const c=data.case;const existing=cases.findIndex(x=>x.id===c.id);if(existing>=0&&!window.confirm('พบรหัสเคสเดิม ต้องการแทนที่ด้วยข้อมูลจากไฟล์นี้หรือไม่? ควรส่งออกเคสเดิมไว้ก่อน'))return;const imported={id:c.id,vehicle:c.vehicle,year:String(c.year||'').slice(0,4),category:c.category,created:c.created,context:String(c.context||'').slice(0,2000),answers:c.answers.map(a=>({id:a.id,question:a.question,answer:a.answer,score:Number.isFinite(a.score)?a.score:undefined})),safety:c.safety,reason:c.reason,status:'queued',mechanic:{},demo:!!c.demo};if(c.mechanic&&typeof c.mechanic==='object'){for(const k of ['name','inspected','diagnosis','plan','updated'])if(typeof c.mechanic[k]==='string')imported.mechanic[k]=c.mechanic[k].slice(0,3000);if(imported.mechanic.diagnosis)imported.status=c.status==='completed'?'completed':'reviewing';}if(existing>=0)cases[existing]=imported;else cases.unshift(imported);persist();go('review/'+imported.id);toast('นำเข้าเคสแล้ว')}catch{toast('อ่านไฟล์ไม่ได้ กรุณาเลือกไฟล์เคส .json ที่ส่งออกจาก Carwise')}finally{e.target.value='';}}
function bind(root=document){root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action,c=cases.find(c=>c.id===b.dataset.id);if(a==='start')start(b.dataset.category);else if(a==='reset-draft'){if(window.confirm('ล้างเฉพาะแบบร่างนี้และเริ่มใหม่? เคสที่บันทึกแล้วจะยังอยู่')){draft=null;persist();go('home')}}else if(a==='demo')demo();else if(a==='resume')go(draft?.stage||'intake');else if(a==='safety'){draft.safety=b.dataset.answer;const reason=C.shouldStop(draft.safety,draft.answers);if(reason)finish(reason);else{draft.stage='questions';persist();go('questions')}}else if(a==='answer'){const q=C.next(draft.category,draft.answers);draft.answers.push({id:q.id,question:q.text,answer:b.dataset.answer,score:q.score});persist();render()}else if(a==='undo'){draft.answers.pop();persist();render()}else if(a==='stop')finish('ผู้ใช้ขอหยุดคัดกรองและให้ช่างตรวจต่อ');else if(a==='handoff'&&c){c.status='queued';persist();render();toast('ส่งเข้าพื้นที่ช่างในเครื่องนี้แล้ว')}else if(a==='accept'&&c){c.status='reviewing';persist();render();toast('รับเคสแล้ว เริ่มบันทึกผลตรวจได้')}else if(a==='txt'&&c)download(c.id+'-summary.txt','\uFEFF'+asText(c),'text/plain;charset=utf-8');else if(a==='json'&&c)download(c.id+'.json',JSON.stringify({format:'carwise-case-v1',case:c},null,2),'application/json');else if(a==='print')window.print();else if(a==='import')$('#import-file').click();else if(a==='filter'){filter=b.dataset.filter;render();}}));}
function render(){const [route,id]=location.hash.slice(1).split('/');switch(route){case'intake':intake();break;case'safety':safety();break;case'questions':questioning();break;case'case':casePage(decodeURIComponent(id||''));break;case'review':review(decodeURIComponent(id||''));break;case'history':listing(false);break;case'garage':listing(true);break;case'method':method();break;default:home();}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});window.addEventListener('storage',e=>{if(e.key==='carwise-cases-v1'){const updated=read('carwise-cases-v1',[]);if(Array.isArray(updated)){cases=updated.filter(C.validCase);render()}}});render();

</script></body></html>
